<!DOCTYPE html>
<html>
<head>
    <title>Phoenix Cluster Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #6cf;
            margin-bottom: 20px;
        }

        .node-card {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }

        /* Active controller highlight */
        .controller {
            border-color: #4caf50;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.5);
        }

        .node-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        /* Role badges */
        .role-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
            margin-left: 10px;
        }

        .masterzero-active { background-color: #007bff; }
        .masterzero-degraded { background-color: #ff9800; }
        .masterzero-recover { background-color: #9c27b0; }
        .secondary-active { background-color: #4caf50; }
        .secondary-passive { background-color: #607d8b; }

        /* Banners */
        .banner {
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        .banner.degraded {
            background-color: #ffeb3b;
            color: #000;
        }

        .banner.recover {
            background-color: #e1bee7;
            color: #4a148c;
        }

        /* Health indicators */
        .health-grid {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .health-item {
            font-weight: bold;
        }

        .ok { color: #4caf50; }
        .bad { color: #f44336; }

        pre {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>

    <script>
        async function refresh() {
            const cluster = await fetch("/cluster").then(r => r.json());
            const logs = await fetch("/logs").then(r => r.json());

            renderCluster(cluster);
            document.getElementById("logs").textContent =
                JSON.stringify(logs, null, 2);
        }

        function renderCluster(cluster) {
            const container = document.getElementById("cluster");
            container.innerHTML = "";

            for (const [name, node] of Object.entries(cluster)) {
                const card = document.createElement("div");
                card.className = "node-card";

                // Highlight active controller
                if (node.role && node.role.endsWith("ACTIVE")) {
                    card.classList.add("controller");
                }

                // Title + role badge
                const title = document.createElement("div");
                title.className = "node-title";
                title.innerHTML = `
                    ${name.toUpperCase()}
                    <span class="role-badge ${node.role.toLowerCase()}">
                        ${node.role}
                    </span>
                `;
                card.appendChild(title);

                // Degraded / Recover banners
                if (node.role === "MASTERZERO-DEGRADED") {
                    card.innerHTML += `
                        <div class="banner degraded">
                            ⚠ MASTERZERO is in DEGRADED mode — mesh or QUIC failing.
                        </div>`;
                }

                if (node.role === "MASTERZERO-RECOVER") {
                    card.innerHTML += `
                        <div class="banner recover">
                            🔄 MASTERZERO is recovering — cluster stabilizing.
                        </div>`;
                }

                // Mesh + QUIC health indicators
                const mesh_ok = node.mesh?.mesh_ok;
                const quic_ok = node.quic?.quic_ok;

                card.innerHTML += `
                    <div class="health-grid">
                        <div class="health-item">
                            Mesh:
                            <span class="${mesh_ok === 'true' ? 'ok' : 'bad'}">
                                ${mesh_ok}
                            </span>
                        </div>
                        <div class="health-item">
                            QUIC:
                            <span class="${quic_ok === 'true' ? 'ok' : 'bad'}">
                                ${quic_ok}
                            </span>
                        </div>
                    </div>
                `;

                // Raw JSON dump (for debugging)
                const raw = document.createElement("pre");
                raw.textContent = JSON.stringify(node, null, 2);
                card.appendChild(raw);

                container.appendChild(card);
            }
        }

        setInterval(refresh, 5000);
        window.onload = refresh;
    </script>
</head>

<body>
    <h1>Phoenix Cluster Dashboard</h1>

    <div id="cluster"></div>

    <div class="node-card">
        <h2>Logs</h2>
        <pre id="logs"></pre>
    </div>
</body>
</html>
